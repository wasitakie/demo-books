name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v5
        id: pages

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
        env:
          NEXT_PUBLIC_CATALOG_CSV_URL: ${{ vars.NEXT_PUBLIC_CATALOG_CSV_URL }}
          SHOP_ORDER_URL: ${{ vars.SHOP_ORDER_URL }}
          SHOP_FACEBOOK_URL: ${{ vars.SHOP_FACEBOOK_URL }}
          SHOP_LINE_URL: ${{ vars.SHOP_LINE_URL }}
          SHOP_EMAIL: ${{ vars.SHOP_EMAIL }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
        id: deployment
