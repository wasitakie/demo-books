name: Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.8.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/configure-pages@v5
        id: pages

      - run: pnpm install --frozen-lockfile

      - run: pnpm test
      - run: pnpm lint
      - run: npm run build
        env:
          GOOGLE_SHEET_ID: 1yQQD7nZDwaK_qRpz6jw9WlEKu2ek6VYB1HNk4aWKs7s
          GOOGLE_SHEET_GID: "257320421"
          GOOGLE_SHEET_RANGE: A1:Z1000
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_PRIVATE_KEY: ${{ secrets.GOOGLE_PRIVATE_KEY }}
          SHOP_ORDER_URL: ${{ vars.SHOP_ORDER_URL }}
          SHOP_FACEBOOK_URL: ${{ vars.SHOP_FACEBOOK_URL }}
          SHOP_LINE_URL: ${{ vars.SHOP_LINE_URL }}
          SHOP_EMAIL: ${{ vars.SHOP_EMAIL }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

      - uses: actions/deploy-pages@v4
        id: deployment
