name: Validate server application

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

# Private Drive covers require a Node.js host. GitHub Pages cannot run the image API.
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test && pnpm lint && pnpm build && pnpm typecheck
